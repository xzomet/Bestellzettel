<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Waiter</title>

        <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f6f6f6;
        }

        h1 {
            margin-top: 0;
        }

        h2, h3 {
            margin-bottom: 8px;
        }

        button {
            padding: 10px 14px;
            margin: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        /* ---------- TABLES VIEW ---------- */

        #tables_view {
            max-width: 600px;
        }

        #tables {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        #tables button {
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            height: 60px;
            font-size: 18px;
        }

        /* ---------- TABLE VIEW ---------- */

        #table_view {
            display: none;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        #close_order {
            margin-top: 0;
            background: #f5dcdc;
            border: 1px solid #d99;
            color: #700;
            font-size: 14px;
            width: 30%;
            min-width: 120px; /* Ensure button doesn't get too small */
        }

        #table_title {
            margin: 0;
            text-align: right;
            flex-grow: 1; /* Take available space */
            padding-left: 16px; /* Space from button */
        }

        #table_layout {            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 900px) {
            #table_layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 12px;
        }

        #menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: #fdfdfd;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        #order_items div {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        #order_items button {
            width: 36px;
            height: 36px;
            font-size: 20px;
            padding: 0;
        }

        #order_total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 12px;
            text-align: right;
        }



        #back_btn {
            margin-top: 12px;
            background: #e0e0e0;
            width: 100%;
            font-size: 16px;
        }

        </style>
    </head>

    <body>

        <h1>Waiter</h1>

        <!-- ---------- TABLES VIEW ---------- -->

        <div id="tables_view">
            <h2>Select Table</h2>
            <div id="tables"></div>
        </div>

        <!-- ---------- TABLE VIEW ---------- -->


        <div id="table_view">
            <div class="header-row">
                <button id="close_order">Close Order</button>
                <h2 id="table_title">Table Title</h2>
            </div>
            <div id="table_layout">
                <!-- Your table content here -->


                <!-- LEFT: ORDER -->



                <div class="panel">
                    <h3>Current Order</h3>
                    <div id="order_items"></div>

                    <div id="order_total"> </div>
                    <button id="back_btn">← Back to tables</button>
                </div>

                <!-- RIGHT: MENU -->
                <div class="panel">
                    <h3>Menu</h3>
                    <div id="menu"></div>
                </div>

            </div>
        </div>

        <script src="/static/waiter.js"></script>
    </body>
</html>
